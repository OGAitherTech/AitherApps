<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Aither Apps</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--white:#fff;--glass:rgba(24,27,34,.58);--blue:#38a8ff}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Arial,sans-serif}
body{user-select:none;overscroll-behavior:none}
button,input{font:inherit}
.bg{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 4%,#173f79 0,#07172d 28%,transparent 55%),radial-gradient(circle at 5% 88%,#063d76 0,transparent 35%),radial-gradient(circle at 95% 85%,#25105c 0,transparent 34%),#000}
.bg:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,transparent 35%,rgba(0,0,0,.35) 100%);pointer-events:none}
.shell{position:relative;z-index:2;width:min(100%,1180px);height:100svh;margin:auto;padding:max(6px,env(safe-area-inset-top)) 10px max(5px,env(safe-area-inset-bottom));display:flex;flex-direction:column}
.status{height:28px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;font-size:15px;font-weight:700;text-shadow:0 2px 8px #000}
.statusRight{display:flex;align-items:center;gap:7px;font-size:11px}.signal{font-size:10px;letter-spacing:-2px}.wifi{font-size:13px}.battery{width:25px;height:12px;border:1.5px solid #fff;border-radius:4px;padding:1px;position:relative}.battery:after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:5px;background:#fff;border-radius:0 2px 2px 0}.battery i{display:block;width:82%;height:100%;background:#fff;border-radius:2px}
.top{height:39px;display:flex;align-items:center;justify-content:space-between;padding:0 7px}.brand{font-size:18px;font-weight:750;letter-spacing:-.4px}.brand span{opacity:.48;font-weight:500}.edit{border:1px solid #ffffff22;background:#ffffff16;color:#fff;border-radius:17px;padding:7px 13px;font-size:12px;font-weight:700;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}.edit:active{transform:scale(.94)}
.search{height:32px;margin:0 7px 8px;display:flex;align-items:center;gap:7px;padding:0 11px;border:1px solid #ffffff1f;border-radius:12px;background:#2529329c;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:inset 0 1px #ffffff0b}.search span{font-size:15px;color:#dfe2e7}.search input{width:100%;border:0;outline:0;background:transparent;color:#fff;font-size:13px}.search input::placeholder{color:#cfd2d7}
.pages{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:pan-y}.page{position:absolute;inset:0;display:grid;align-content:start;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px 7px;padding:3px 1px;opacity:0;transform:translateX(22px);pointer-events:none;transition:opacity .22s ease,transform .22s ease}.page.active{opacity:1;transform:none;pointer-events:auto}
.app{border:0;background:transparent;padding:0;min-width:0;cursor:pointer;position:relative;transition:transform .14s ease,filter .14s ease}.app:active{transform:scale(.9);filter:brightness(1.2)}.icon{width:100%;aspect-ratio:95/84;border-radius:7px;background-image:url("data:image/png;base64,__AITHER_ICON_SPRITE__");background-repeat:no-repeat;background-size:500% 500%;background-position:calc(var(--x)*25%) calc(var(--y)*25%);box-shadow:0 6px 17px #0007,0 0 10px #008cff20;overflow:hidden}
.bottom{display:flex;flex-direction:column;align-items:center;padding-top:3px}.dots{height:17px;display:flex;align-items:center;gap:6px}.dot{width:6px;height:6px;border:0;border-radius:50%;padding:0;background:#ffffff55}.dot.active{background:#fff;transform:scale(1.15)}
.dock{width:min(100%,410px);height:70px;padding:7px;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;border-radius:24px;border:1px solid #ffffff22;background:#34363d9e;backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);box-shadow:0 15px 40px #0009,inset 0 1px #ffffff10}.dock .app{border-radius:17px;overflow:hidden}.dock .icon{border-radius:17px;box-shadow:0 4px 14px #0008}
.home{width:126px;height:5px;border-radius:8px;background:#fff;margin:8px 0 1px;box-shadow:0 1px 4px #000}
.sheet-bg{position:fixed;inset:0;z-index:20;display:grid;place-items:end center;background:#0008;backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);opacity:0;pointer-events:none;transition:.2s}.sheet-bg.open{opacity:1;pointer-events:auto}.sheet{width:min(100%,560px);margin:0 10px max(10px,env(safe-area-inset-bottom));padding:18px;border:1px solid #ffffff20;border-radius:27px;background:#1c1e24f5;box-shadow:0 25px 80px #000c}.sheet h2{margin:0 0 6px;font-size:20px}.sheet p{margin:0 0 14px;color:#c3c6cc;font-size:13px}.sheet button{width:100%;border:0;border-radius:15px;padding:12px;margin-top:7px;background:#ffffff10;color:#fff;text-align:left}.sheet .primary{background:#168cff;font-weight:700}
.toast{position:fixed;z-index:30;left:50%;bottom:104px;transform:translate(-50%,14px);opacity:0;pointer-events:none;background:#1b1d22ed;border:1px solid #ffffff20;border-radius:17px;padding:10px 15px;font-size:13px;font-weight:650;transition:.2s;white-space:nowrap;box-shadow:0 12px 35px #0008}.toast.show{opacity:1;transform:translate(-50%,0)}
.editing .app{animation:jiggle .16s infinite alternate}.editing .app:nth-child(2n){animation-delay:-.08s}@keyframes jiggle{from{transform:rotate(-.7deg)}to{transform:rotate(.7deg)}}
@media(max-width:800px){.shell{padding-left:8px;padding-right:8px}.top{height:37px}.brand{font-size:17px}.page{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 6px}.dock{width:min(100%,385px)}}
@media(max-width:390px){.page{gap:8px 5px}.search{margin-bottom:6px}.dock{height:64px}.home{margin-top:7px}}
@media(min-width:801px){.shell{padding:15px 28px 10px}.status{display:none}.top{height:48px}.search{max-width:540px}.page{grid-template-columns:repeat(5,minmax(0,1fr));gap:14px 10px;padding:8px}.dock{height:74px}}
</style>
</head>
<body>
<div class="bg"></div>
<main class="shell" id="shell">
<div class="status"><span id="time">9:41</span><div class="statusRight"><span class="signal">▮▮▮</span><span class="wifi">⌁</span><span class="battery"><i></i></span></div></div>
<div class="top"><div class="brand">Aither <span>Apps</span></div><button class="edit" id="edit">Edit</button></div>
<label class="search"><span>⌕</span><input id="search" type="search" placeholder="Search Apps" autocomplete="off" enterkeyhint="search"></label>
<section class="pages" id="pages"></section>
<footer class="bottom"><div class="dots" id="dots"></div><nav class="dock" id="dock"></nav><div class="home"></div></footer>
</main>
<div class="toast" id="toast"></div>
<div class="sheet-bg" id="modal"><div class="sheet"><h2 id="sheetTitle"></h2><p id="sheetText"></p><button class="primary" id="openBtn">Open</button><button id="closeBtn">Close</button></div></div>
<script>
const APPS=[
{name:'Email',x:0,y:0,url:'#'},
{name:'Texting',x:1,y:0,url:'#'},
{name:'Settings',x:2,y:0,url:'#'},
{name:'Passwords',x:3,y:0,url:'#'},
{name:'Photos',x:4,y:0,url:'#'},
{name:'Camera',x:0,y:1,url:'#'},
{name:'Aither AI',x:1,y:1,url:'https://ogaithertech.github.io/AitherAI/'},
{name:'App Store',x:2,y:1,url:'#'},
{name:'Tips',x:3,y:1,url:'#'},
{name:'Help',x:4,y:1,url:'#'},
{name:'Document Viewing',x:0,y:2,url:'#'},
{name:'Contacts',x:1,y:2,url:'#'},
{name:'Calling',x:2,y:2,url:'#'},
{name:'Shortcuts',x:3,y:2,url:'#'},
{name:'Browser',x:4,y:2,url:'https://ogaithertech.github.io/AitherWeb/'},
{name:'Calculator',x:0,y:3,url:'https://ogaithertech.github.io/AitherCalculator/'},
{name:'Maps',x:1,y:3,url:'https://ogaithertech.github.io/AitherMaps/'},
{name:'Clock',x:2,y:3,url:'https://ogaithertech.github.io/AitherClock/'},
{name:'Weather',x:3,y:4,url:'https://ogaithertech.github.io/WhatTheWether/'},
{name:'Notes / Document',x:4,y:4,url:'https://ogaithertech.github.io/AitherNotes/'}
];
const DOCK=['Calling','Browser','Notes / Document','Settings'];
const pagesEl=document.getElementById('pages'),dotsEl=document.getElementById('dots'),dockEl=document.getElementById('dock'),searchEl=document.getElementById('search'),shell=document.getElementById('shell'),modal=document.getElementById('modal'),toast=document.getElementById('toast');
let page=0,selected=null,editing=false,startX=0;
function icon(a){const b=document.createElement('button');b.className='app';b.dataset.name=a.name.toLowerCase();b.innerHTML='<span class="icon" style="--x:'+a.x+';--y:'+a.y+'"></span>';b.addEventListener('click',()=>launch(a));return b}
function launch(a){if(editing)return;selected=a;if(a.url!=='#'){window.location.href=a.url;return}document.getElementById('sheetTitle').textContent=a.name;document.getElementById('sheetText').textContent=a.name+' is not connected yet.';modal.classList.add('open')}
function pageSize(){return innerWidth<=800?12:15}
function render(){const old=page;pagesEl.innerHTML='';dotsEl.innerHTML='';const size=pageSize();for(let i=0;i<APPS.length;i+=size){const p=document.createElement('div');p.className='page';APPS.slice(i,i+size).forEach(a=>p.appendChild(icon(a)));pagesEl.appendChild(p);const d=document.createElement('button');d.className='dot';d.setAttribute('aria-label','Page '+(i/size+1));d.onclick=()=>go(i/size);dotsEl.appendChild(d)}page=Math.min(old,Math.max(0,pagesEl.children.length-1));go(page);renderDock()}
function renderDock(){dockEl.innerHTML='';DOCK.forEach(n=>{const a=APPS.find(x=>x.name===n);if(a)dockEl.appendChild(icon(a))})}
function go(n){const total=pagesEl.children.length;if(!total)return;page=Math.max(0,Math.min(n,total-1));[...pagesEl.children].forEach((p,i)=>p.classList.toggle('active',i===page));[...dotsEl.children].forEach((d,i)=>d.classList.toggle('active',i===page))}
searchEl.addEventListener('input',()=>{const q=searchEl.value.trim().toLowerCase();document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',!!q));document.querySelectorAll('.dot').forEach(d=>d.classList.toggle('active',!!q));document.querySelectorAll('.page .app').forEach(a=>a.style.display=!q||a.dataset.name.includes(q)?'':'none');if(!q){document.querySelectorAll('.page .app').forEach(a=>a.style.display='');go(page)}});
document.getElementById('edit').onclick=()=>{editing=!editing;shell.classList.toggle('editing',editing);document.getElementById('edit').textContent=editing?'Done':'Edit';show(editing?'Home Screen editing':'Done')};
document.getElementById('closeBtn').onclick=()=>modal.classList.remove('open');modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('open')});document.getElementById('openBtn').onclick=()=>{modal.classList.remove('open');show((selected?selected.name:'App')+' is coming soon')};
pagesEl.addEventListener('touchstart',e=>startX=e.touches[0].clientX,{passive:true});pagesEl.addEventListener('touchend',e=>{if(searchEl.value)return;const dx=e.changedTouches[0].clientX-startX;if(Math.abs(dx)>45)go(page+(dx<0?1:-1))},{passive:true});
function show(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(show.t);show.t=setTimeout(()=>toast.classList.remove('show'),1500)}
function tick(){document.getElementById('time').textContent=new Intl.DateTimeFormat([], {hour:'numeric',minute:'2-digit'}).format(new Date())}tick();setInterval(tick,15000);addEventListener('resize',()=>render());render();
</script>
</body></html>
