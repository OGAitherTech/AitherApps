<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05070c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Aither Apps</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--text:#fff;--muted:#d5d7dc;--glass:rgba(20,23,30,.52);--line:rgba(255,255,255,.18);--blue:#39a7ff}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030509;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Arial,sans-serif}
button{font:inherit;color:inherit}
body{min-height:100svh;user-select:none}
.wallpaper{position:fixed;inset:0;overflow:hidden;background:radial-gradient(circle at 50% 12%,#163b70 0,#09172d 23%,#03060c 58%,#000 100%)}
.wallpaper:before,.wallpaper:after{content:"";position:absolute;border-radius:50%;filter:blur(55px);opacity:.7}
.wallpaper:before{width:55vw;height:55vw;left:-15vw;top:18vh;background:#073c78}
.wallpaper:after{width:48vw;height:48vw;right:-12vw;bottom:8vh;background:#26156c}
.shell{position:relative;z-index:2;width:min(100%,1180px);height:100svh;margin:auto;padding:max(10px,env(safe-area-inset-top)) 14px max(10px,env(safe-area-inset-bottom));display:flex;flex-direction:column}
.status{height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;font-weight:700;font-size:15px;text-shadow:0 1px 5px #000}
.statusRight{display:flex;align-items:center;gap:7px;font-size:12px}.signal{letter-spacing:-2px}.battery{width:25px;height:12px;border:1.5px solid #fff;border-radius:4px;padding:1px;position:relative}.battery:after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:5px;border-radius:0 2px 2px 0;background:#fff}.battery i{display:block;width:82%;height:100%;border-radius:2px;background:#fff}
.header{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 5px}.title{font-size:19px;font-weight:750;letter-spacing:-.4px}.title span{opacity:.55;font-weight:500}.edit{border:0;background:rgba(255,255,255,.13);backdrop-filter:blur(15px);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:7px 12px;font-size:12px;font-weight:700}.edit:active{transform:scale(.94)}
.search{height:32px;margin:0 5px 10px;border:1px solid rgba(255,255,255,.13);background:rgba(30,34,43,.42);backdrop-filter:blur(18px);border-radius:12px;display:flex;align-items:center;gap:7px;padding:0 11px;color:#d7d9df}.search span{font-size:13px}.search input{width:100%;border:0;outline:0;background:transparent;color:#fff;font-size:13px;font-family:inherit}.search input::placeholder{color:#c9cbd1}
.pages{flex:1;min-height:0;overflow:hidden;touch-action:pan-y}.page{width:100%;height:100%;display:none;align-content:start;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px 9px;padding:2px 2px 10px}.page.active{display:grid}
.app{appearance:none;border:1px solid rgba(255,255,255,.23);background:linear-gradient(180deg,rgba(18,21,27,.78),rgba(3,5,9,.68));border-radius:10px;padding:4px 3px 6px;cursor:pointer;box-shadow:0 7px 22px rgba(0,0,0,.38),inset 0 0 0 1px rgba(255,255,255,.025);transition:transform .16s ease,filter .16s ease}.app:active{transform:scale(.91);filter:brightness(1.2)}.app:focus-visible{outline:2px solid #7cc8ff;outline-offset:2px}
.icon{width:100%;aspect-ratio:1;display:grid;place-items:center;position:relative;border-radius:13px;overflow:hidden;background:radial-gradient(circle at 50% 30%,#204f94 0,#0b2348 42%,#030913 78%);border:1px solid rgba(132,205,255,.6);box-shadow:0 0 11px rgba(0,137,255,.35),inset 0 0 22px rgba(0,103,255,.16)}.icon:before{content:"";position:absolute;inset:7%;border:2px solid rgba(190,228,255,.85);clip-path:polygon(50% 0,92% 23%,100% 78%,50% 100%,0 78%,8% 23%);filter:drop-shadow(0 0 6px #168cff)}.icon:after{content:"";position:absolute;inset:0;background:linear-gradient(125deg,rgba(255,255,255,.18),transparent 28%,transparent 65%,rgba(0,120,255,.08));pointer-events:none}svg{width:57%;height:57%;z-index:1;stroke:#f4f9ff;fill:none;stroke-width:2.15;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px #168cff)}
.label{display:block;margin-top:5px;min-height:20px;text-align:center;font-size:9px;line-height:10px;letter-spacing:.35px;font-weight:650;text-shadow:0 1px 5px #000}.app.hidden{display:none}
.bottom{display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:4px}.dots{display:flex;gap:6px}.dot{width:6px;height:6px;border:0;border-radius:50%;padding:0;background:rgba(255,255,255,.38)}.dot.active{background:#fff;transform:scale(1.15)}
.dock{width:min(100%,390px);height:68px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:7px;border:1px solid rgba(255,255,255,.18);border-radius:24px;background:rgba(40,43,50,.52);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 10px 35px rgba(0,0,0,.35)}.dock .app{border:0;padding:0;background:transparent;box-shadow:none;border-radius:17px}.dock .icon{border:0;border-radius:17px;box-shadow:0 3px 12px #0008}.dock .label{display:none}.dock .app:active{transform:scale(.88)}
.homeIndicator{width:125px;height:5px;border-radius:10px;background:#fff;margin-top:8px;opacity:.9}
.toast{position:fixed;z-index:20;left:50%;bottom:100px;transform:translate(-50%,15px);opacity:0;pointer-events:none;background:rgba(22,24,29,.88);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:10px 15px;font-size:13px;font-weight:650;transition:.22s ease;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;z-index:30;display:none;place-items:end center;background:rgba(0,0,0,.38);backdrop-filter:blur(5px)}.modal.open{display:grid}.sheet{width:min(100%,560px);margin:0 10px max(10px,env(safe-area-inset-bottom));padding:18px;border-radius:26px;background:rgba(28,30,36,.94);border:1px solid rgba(255,255,255,.15);box-shadow:0 20px 70px #000b}.sheet h2{margin:0 0 7px;font-size:20px}.sheet p{margin:0 0 15px;color:#bfc3ca;font-size:13px}.sheet button{width:100%;border:0;border-radius:15px;padding:12px;margin-top:7px;background:rgba(255,255,255,.1);text-align:left}.sheet button.primary{background:#168cff;font-weight:700}.sheet button:active{transform:scale(.98)}
@media(max-width:800px){.shell{padding-left:10px;padding-right:10px}.status{padding:0 7px}.header{height:40px}.title{font-size:17px}.search{margin-bottom:9px}.page{grid-template-columns:repeat(4,minmax(0,1fr));gap:13px 9px}.label{font-size:8.5px}.dock{width:min(100%,370px)}}
@media(max-width:390px){.page{gap:10px 7px}.label{font-size:8px;letter-spacing:.15px}.dock{height:64px}.status{font-size:14px}}
@media(min-width:801px){.shell{padding-top:16px}.status{display:none}.header{height:50px}.search{max-width:520px}.page{padding-top:8px}.dock{height:72px}}
</style>
</head>
<body>
<div class="wallpaper"></div>
<main class="shell">
  <div class="status"><span id="time">9:41</span><div class="statusRight"><span class="signal">▮▮▮</span><span>Wi-Fi</span><span class="battery"><i></i></span></div></div>
  <header class="header"><div class="title">Aither <span>Apps</span></div><button class="edit" id="editBtn">Edit</button></header>
  <label class="search"><span>⌕</span><input id="search" type="search" placeholder="Search Apps" autocomplete="off"></label>
  <section class="pages" id="pages"></section>
  <div class="bottom"><div class="dots" id="dots"></div><nav class="dock" id="dock"></nav><div class="homeIndicator"></div></div>
</main>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="sheet"><h2 id="sheetTitle">App</h2><p id="sheetText">This app isn't connected yet.</p><button class="primary" id="openBtn">Open</button><button id="closeBtn">Close</button></div></div>
<script>
const apps=[
['Email','mail','tools','#'],['Texting','message','tools','#'],['Settings','settings','tools','#'],['Passwords','lock','tools','#'],['Photos','photos','tools','#'],['Camera','camera','tools','#'],
['Aither AI','brain','aither','https://ogaithertech.github.io/AitherAI/'],['App Store','store','aither','#'],['Tips','bulb','tools','#'],['Help','help','tools','#'],['Document Viewing','document','tools','#'],['Contacts','person','tools','#'],
['Calling','phone','tools','#'],['Shortcuts','shortcuts','aither','#'],['Browser','globe','aither','https://ogaithertech.github.io/AitherWeb/'],['Calculator','calculator','aither','https://ogaithertech.github.io/AitherCalculator/'],['Maps','pin','aither','https://ogaithertech.github.io/AitherMaps/'],['Clock','clock','aither','https://ogaithertech.github.io/AitherClock/'],
['Weather','weather','aither','https://ogaithertech.github.io/WhatTheWether/'],['Notes / Document','notes','aither','https://ogaithertech.github.io/AitherNotes/']
];
const dockNames=['Calling','Browser','Notes / Document','Settings'];
const I={
mail:'<rect x="4" y="6" width="16" height="12" rx="2"/><path d="m5 8 7 5 7-5"/>',message:'<path d="M20 11.5a7.5 7.5 0 0 1-8 7.5 9 9 0 0 1-4-.9L4 20l1.3-3.5A7.3 7.3 0 0 1 4 11.5 7.5 7.5 0 0 1 12 4a7.5 7.5 0 0 1 8 7.5Z"/><circle cx="8.5" cy="11.5" r=".6" fill="currentColor"/><circle cx="12" cy="11.5" r=".6" fill="currentColor"/><circle cx="15.5" cy="11.5" r=".6" fill="currentColor"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M19 15.2a1.7 1.7 0 0 0 .3 1.9l.1.1-1.7 1.7-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-2.4v-.2a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1-1.7-1.7.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H6v-2.4h.4a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1 1.7-1.7.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6V6h2.4v.4a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1 1.7 1.7-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0-1.6.5Z"/>',lock:'<rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15" r="1"/>',photos:'<circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5"/><circle cx="17.5" cy="7" r="1"/>',camera:'<path d="M4 8h3l1.4-2h7.2L17 8h3v10H4Z"/><circle cx="12" cy="13" r="3.3"/>',brain:'<path d="M9.2 5.2A3.2 3.2 0 0 0 6 8.4v.2A3 3 0 0 0 5 14a3 3 0 0 0 3 4h1.2M14.8 5.2A3.2 3.2 0 0 1 18 8.4v.2a3 3 0 0 1 1 5.4 3 3 0 0 1-3 4h-1.2M12 4v16M8 9h2M14 9h2M8 14h2M14 14h2"/>',store:'<path d="M5 8h14l-1 11H6L5 8Z"/><path d="M8 8a4 4 0 0 1 8 0"/>',bulb:'<path d="M9 17h6M10 20h4"/><path d="M8 13a6 6 0 1 1 8 0c-1 1-1.5 2-1.5 4h-5c0-2-.5-3-1.5-4Z"/>',help:'<circle cx="12" cy="12" r="8"/><path d="M9.7 9a2.4 2.4 0 1 1 4.1 1.7c-1.2 1.1-1.8 1.4-1.8 2.8M12 16h.01"/>',document:'<path d="M7 3h7l4 4v14H7Z"/><path d="M14 3v5h4M9.5 12h5M9.5 15h5M9.5 18h3"/>',person:'<circle cx="12" cy="8" r="3"/><path d="M5 20a7 7 0 0 1 14 0"/>',phone:'<path d="M7 4 4.5 6.5C5.5 13 9 16.5 15.5 17.5L18 15l-3-3-2 1c-1.7-.8-2.7-1.8-3.5-3.5l1-2Z"/>',shortcuts:'<path d="m13 3 6 6-4 4-6-6 4-4ZM9 11l-6 6 4 4 6-6"/>',globe:'<circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4a12 12 0 0 1 0 16M12 4a12 12 0 0 0 0 16"/>',calculator:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 11h2M14 11h2M8 15h2M14 15h2M8 18h2M14 18h2"/>',pin:'<path d="M12 21s6-6.2 6-11a6 6 0 1 0-12 0c0 4.8 6 11 6 11Z"/><circle cx="12" cy="10" r="2"/>',clock:'<circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/>',weather:'<path d="M7 17h10a4 4 0 0 0 .4-8 5 5 0 0 0-9.7 1A3.5 3.5 0 0 0 7 17Z"/><path d="M8 5v2M4.5 7.5 6 8.5M12 4l-1 2"/>',notes:'<path d="M6 3h12v18H6Z"/><path d="M9 7h6M9 11h6M9 15h4"/>'};
const pages=document.getElementById('pages'),dots=document.getElementById('dots'),dock=document.getElementById('dock'),search=document.getElementById('search'),toast=document.getElementById('toast'),modal=document.getElementById('modal');
let current=0, selected=null, editing=false;
function icon(app){return `<span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true">${I[app[1]]||I.help}</svg></span>`}
function makeButton(app,dockMode=false){const b=document.createElement('button');b.className='app';b.dataset.name=app[0].toLowerCase();b.setAttribute('aria-label',app[0]);b.innerHTML=icon(app)+`<span class="label">${app[0]}</span>`;b.onclick=()=>openApp(app);if(dockMode)b.title=app[0];return b}
function openApp(app){if(editing)return;selected=app;if(app[3]&&app[3]!=='#'){location.href=app[3];return}document.getElementById('sheetTitle').textContent=app[0];document.getElementById('sheetText').textContent=app[0]+' is part of Aither Apps, but it is not connected yet.';document.getElementById('openBtn').textContent='Open';modal.classList.add('open')}
function build(){pages.innerHTML='';dots.innerHTML='';const per=window.innerWidth<=800?12:18;for(let p=0;p<Math.ceil(apps.length/per);p++){const page=document.createElement('div');page.className='page'+(p===0?' active':'');apps.slice(p*per,(p+1)*per).forEach(a=>page.appendChild(makeButton(a)));pages.appendChild(page);const d=document.createElement('button');d.className='dot'+(p===0?' active':'');d.onclick=()=>go(p);dots.appendChild(d)}dock.innerHTML='';dockNames.forEach(n=>{const a=apps.find(x=>x[0]===n);if(a)dock.appendChild(makeButton(a,true))});go(0)}
function go(n){const total=pages.children.length;if(!total)return;current=Math.max(0,Math.min(n,total-1));[...pages.children].forEach((p,i)=>p.classList.toggle('active',i===current));[...dots.children].forEach((d,i)=>d.classList.toggle('active',i===current))}
function filter(){const q=search.value.trim().toLowerCase();document.querySelectorAll('.page .app').forEach(b=>b.classList.toggle('hidden',q&&!b.dataset.name.includes(q)));if(q){[...pages.children].forEach(p=>p.classList.add('active'));[...dots.children].forEach(d=>d.classList.add('active'))}else go(current)}
search.addEventListener('input',filter);search.addEventListener('keydown',e=>{if(e.key==='Escape'){search.value='';filter();search.blur()}});
document.getElementById('closeBtn').onclick=()=>modal.classList.remove('open');document.getElementById('openBtn').onclick=()=>{if(selected&&selected[3]&&selected[3]!=='#')location.href=selected[3];else{modal.classList.remove('open');showToast(selected[0]+' is coming soon')}};modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('open')});
document.getElementById('editBtn').onclick=()=>{editing=!editing;document.getElementById('editBtn').textContent=editing?'Done':'Edit';document.querySelectorAll('.app').forEach(b=>b.style.animation=editing?'shake .18s infinite alternate':'none');showToast(editing?'Home Screen editing enabled':'Done')};
let startX=0;pages.addEventListener('touchstart',e=>{startX=e.touches[0].clientX},{passive:true});pages.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-startX;if(Math.abs(dx)>45&&!search.value)go(current+(dx<0?1:-1))},{passive:true});
pages.addEventListener('wheel',e=>{if(Math.abs(e.deltaX)>25&&!search.value)go(current+(e.deltaX>0?1:-1))},{passive:true});
function showToast(t){toast.textContent=t;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),1800)}
function tick(){const now=new Date();document.getElementById('time').textContent=new Intl.DateTimeFormat([], {hour:'numeric',minute:'2-digit'}).format(now);document.title='Aither Apps • '+document.getElementById('time').textContent}tick();setInterval(tick,15000);window.addEventListener('resize',()=>{const old=current;build();go(Math.min(old,pages.children.length-1))});build();
</script>
<style>@keyframes shake{from{transform:rotate(-.7deg)}to{transform:rotate(.7deg)}}</style>
</body>
</html>
