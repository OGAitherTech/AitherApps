<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000"><title>Aither Apps</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#000;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}body{min-height:100svh}.shell{max-width:1100px;margin:auto;padding:env(safe-area-inset-top) 18px 30px}.top{height:54px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:21px;font-weight:700}.brand span,.clock{color:#aaa}.clock{font-size:14px}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px 9px}.app{appearance:none;border:1px solid #ffffff2e;background:linear-gradient(#101114,#050608);border-radius:7px;padding:5px 4px 7px;color:#fff;cursor:pointer;box-shadow:0 5px 16px #000b;transition:.14s}.app:active{transform:scale(.94)}.icon{width:100%;aspect-ratio:1;display:grid;place-items:center;position:relative;border-radius:11px;overflow:hidden;background:radial-gradient(circle at 50% 35%,#193a73,#07142b 48%,#02040a);border:1px solid #73beff73;box-shadow:0 0 8px #0084ff47,inset 0 0 14px #0084ff1f}.icon:before{content:"";position:absolute;inset:7%;border:2px solid #a0d2ffc0;clip-path:polygon(50% 0,92% 23%,100% 78%,50% 100%,0 78%,8% 23%);filter:drop-shadow(0 0 5px #178bff)}svg{width:58%;height:58%;z-index:1;stroke:#f2f7ff;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 5px #168cff)}.label{display:block;margin-top:5px;min-height:22px;text-align:center;font-size:10px;line-height:11px;letter-spacing:.5px;font-weight:600}.dock{display:flex;justify-content:center;gap:5px;margin:18px auto 0;width:max-content;padding:7px;border:1px solid #ffffff1a;border-radius:22px;background:#232326b8;backdrop-filter:blur(18px)}.dock button{border:0;background:transparent;color:#aaa;font-size:11px;padding:6px 11px;border-radius:14px}.dock button.active{background:#ffffff1c;color:#fff}@media(max-width:800px){.shell{padding-left:12px;padding-right:12px}.grid{grid-template-columns:repeat(4,1fr);gap:12px 9px}.label{font-size:9px;letter-spacing:.3px}}@media(min-width:801px) and (max-width:980px){.grid{grid-template-columns:repeat(5,1fr)}}@media(max-width:390px){.grid{gap:10px 7px}.label{font-size:8.5px}}</style></head><body><main class="shell"><header class="top"><div class="brand">Aither <span>Apps</span></div><div id="clock" class="clock"></div></header><section id="grid" class="grid"></section><nav class="dock"><button class="active" data-f="all">All</button><button data-f="aither">Aither</button><button data-f="tools">Tools</button></nav></main><script>const apps=[['EMAIL','mail','tools','#'],['TEXTING','message','tools','#'],['SETTINGS','settings','tools','#'],['PASSWORDS','lock','tools','#'],['PHOTOS','photos','tools','#'],['CAMERA','camera','tools','#'],['AITHER AI','brain','aither','https://ogaithertech.github.io/AitherAI/'],['APP STORE','store','aither','#'],['TIPS','bulb','tools','#'],['HELP','help','tools','#'],['DOCUMENT VIEWING','document','tools','#'],['CONTACTS','person','tools','#'],['CALLING','phone','tools','#'],['SHORTCUTS','shortcuts','aither','#'],['BROWSER','globe','aither','https://ogaithertech.github.io/AitherWeb/'],['CALCULATOR','calculator','aither','https://ogaithertech.github.io/AitherCalculator/'],['MAPS','pin','aither','https://ogaithertech.github.io/AitherMaps/'],['CLOCK','clock','aither','https://ogaithertech.github.io/AitherClock/'],['WEATHER','weather','aither','https://ogaithertech.github.io/WhatTheWether/'],['NOTES / DOCUMENT','notes','aither','https://ogaithertech.github.io/AitherNotes/']];const I={mail:'<rect x="4" y="6" width="16" height="12" rx="2"/><path d="m5 8 7 5 7-5"/>',message:'<path d="M20 11.5a7.5 7.5 0 0 1-8 7.5 9 9 0 0 1-4-.9L4 20l1.3-3.5A7.3 7.3 0 0 1 4 11.5 7.5 7.5 0 0 1 12 4a7.5 7.5 0 0 1 8 7.5Z"/><circle cx="8.5" cy="11.5" r=".6" fill="currentColor"/><circle cx="12" cy="11.5" r=".6" fill="currentColor"/><circle cx="15.5" cy="11.5" r=".6" fill="currentColor"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M19 15.2a1.7 1.7 0 0 0 .3 1.9l.1.1-1.7 1.7-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-2.4v-.2a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1-1.7-1.7.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H6v-2.4h.4a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1 1.7-1.7.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6V6h2.4v.4a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1 1.7 1.7-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v2.4h-.2a1.7 1.7 0 0 0-1.6.5Z"/>',lock:'<rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15" r="1"/>',photos:'<circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5"/><circle cx="17.5" cy="7" r="1"/>',camera:'<path d="M4 8h3l1.4-2h7.2L17 8h3v10H4Z"/><circle cx="12" cy="13" r="3.3"/>',brain:'<path d="M9.2 5.2A3.2 3.2 0 0 0 6 8.4v.2A3 3 0 0 0 5 14a3 3 0 0 0 3 4h1.2M14.8 5.2A3.2 3.2 0 0 1 18 8.4v.2a3 3 0 0 1 1 5.4 3 3 0 0 1-3 4h-1.2M12 4v16M8 9h2M14 9h2M8 14h2M14 14h2"/>',store:'<path d="M5 8h14l-1 11H6L5 8Z"/><path d="M8 8a4 4 0 0 1 8 0"/>',bulb:'<path d="M9 17h6M10 20h4"/><path d="M8 13a6 6 0 1 1 8 0c-1 1-1.5 2-1.5 4h-5c0-2-.5-3-1.5-4Z"/>',help:'<circle cx="12" cy="12" r="8"/><path d="M9.7 9a2.4 2.4 0 1 1 4.1 1.7c-1.2 1.1-1.8 1.4-1.8 2.8M12 16h.01"/>',document:'<path d="M7 3h7l4 4v14H7Z"/><path d="M14 3v5h4M9.5 12h5M9.5 15h5M9.5 18h3"/>',person:'<circle cx="12" cy="8" r="3"/><path d="M5 20a7 7 0 0 1 14 0"/>',phone:'<path d="M7 4 4.5 6.5C5.5 13 9 16.5 15.5 17.5L18 15l-3-3-2 1c-1.7-.8-2.7-1.8-3.5-3.5l1-2Z"/>',shortcuts:'<path d="m13 3 6 6-4 4-6-6 4-4ZM9 11l-6 6 4 4 6-6"/>',globe:'<circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4a12 12 0 0 1 0 16M12 4a12 12 0 0 0 0 16"/>',calculator:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 11h2M14 11h2M8 15h2M14 15h2M8 18h2M14 18h2"/>',pin:'<path d="M12 21s6-6.2 6-11a6 6 0 1 0-12 0c0 4.8 6 11 6 11Z"/><circle cx="12" cy="10" r="2"/>',clock:'<circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/>',weather:'<path d="M7 17h10a4 4 0 0 0 .4-8 5 5 0 0 0-9.7 1A3.5 3.5 0 0 0 7 17Z"/><path d="M8 5v2M4.5 7.5 6 8.5M12 4l-1 2"/>',notes:'<path d="M6 3h12v18H6Z"/><path d="M9 7h6M9 11h6M9 15h4"/>'};const grid=document.querySelector('#grid');function render(f='all'){grid.innerHTML='';apps.filter(a=>f==='all'||a[2]===f).forEach(([n,i,t,u])=>{const b=document.createElement('button');b.className='app';b.innerHTML=`<span class="icon"><svg viewBox="0 0 24 24">${I[i]}</svg></span><span class="label">${n}</span>`;b.onclick=()=>u!=='#'?location.href=u:alert(n+' is coming soon.');grid.appendChild(b)})}document.querySelectorAll('.dock button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.dock button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.f)});function tick(){document.querySelector('#clock').textContent=new Intl.DateTimeFormat([], {hour:'numeric',minute:'2-digit'}).format(new Date())}tick();setInterval(tick,15000);render();</script></body></html>
